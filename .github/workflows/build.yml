name: Build
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "README.md", "scripts/deploy_site.py"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - run: mise exec -- cargo test --locked
      - run: mise run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipmark-macos-build
          path: dist/pipmark-*.zip
